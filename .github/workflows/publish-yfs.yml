name: Publish YourFutureSite refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-yfs.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write refreshed site
        shell: bash
        run: |
          cat > /tmp/index.b64 <<'EOF_INDEX'

EOF_INDEX
          cat > /tmp/starlite.b64 <<'EOF_STARLITE'

EOF_STARLITE
          cat > /tmp/moss.b64 <<'EOF_MOSS'

EOF_MOSS
          cat > /tmp/brass.b64 <<'EOF_BRASS'

EOF_BRASS
          for spec in 'index:/tmp/index.b64:index.html' 'starlite:/tmp/starlite.b64:starlite-junction.html' 'moss:/tmp/moss.b64:moss-ember-coffee.html' 'brass:/tmp/brass.b64:brassline-barber.html'; do
            IFS=: read -r _ src out <<< "$spec"
            base64 -d "$src" | gzip -d > "$out"
          done
          rm -f .github/workflows/publish-yfs.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh YourFutureSite and add live portfolio concepts'
          git push
