name: Publish YourFutureSite refresh

on:
  push:
    paths:
      - '.github/workflows/yfs-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish refreshed site
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < .yfs-payload/index.gz.b64 | gzip -d > index.html
          base64 -d < .yfs-payload/starlite-junction.gz.b64 | gzip -d > starlite-junction.html
          cat .yfs-payload/moss.* | base64 -d | gzip -d > moss-ember-coffee.html
          cat .yfs-payload/barber.* | base64 -d | gzip -d > brassline-barber.html
          rm -rf .yfs-payload
          rm -f .github/workflows/yfs-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh YourFutureSite portfolio'
            git push
          fi
